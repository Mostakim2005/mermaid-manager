name: Build Portable + Installer

# Release pipeline.
#
#  * Push to master that changes app code  -> version is computed automatically
#    (next patch after the newest v* tag, or drawio/VERSION when that is newer),
#    the release creates its own tag, and both the portable .exe and the Windows
#    installer are published.
#  * Push a v* tag                        -> rebuilds exactly that version.
#  * Run workflow_dispatch                -> optional explicit version; empty
#    means auto-bump.

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
    paths:
      - 'drawio-desktop/**'
      - 'mermaid-visual-editor/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version (e.g. 32.6.3). Leave empty to auto-bump.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-portable:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: drawio-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Work out the release version
        shell: pwsh
        env:
          EXPLICIT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
            Write-Host "Version taken from tag: $version"
          }
          elseif ($env:EXPLICIT_VERSION) {
            $version = $env:EXPLICIT_VERSION.TrimStart('v')
            Write-Host "Version taken from input: $version"
          }
          else {
            $base = (Get-Content drawio\VERSION -Raw).Trim()
            $latestTag = git tag -l 'v*' --sort=-v:refname | Select-Object -First 1
            Write-Host "Newest tag: '$latestTag' ; drawio/VERSION: $base"
            if (-not $latestTag) {
              $version = $base
            }
            else {
              $latest = [version]($latestTag.TrimStart('v') -replace '[^0-9.].*$', '')
              $baseVersion = [version]$base
              if ($baseVersion -gt $latest) {
                $version = $base
              }
              else {
                $version = '{0}.{1}.{2}' -f $latest.Major, $latest.Minor, ($latest.Build + 1)
              }
            }
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Computed version '$version' is not MAJOR.MINOR.PATCH"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Releasing $version (tag v$version)"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: drawio-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync version and disable self-update
        # drawio/VERSION stays upstream's version; the release version is
        # stamped from the computed tag in the next step. disableUpdate stops
        # the official draw.io auto-updater from replacing this custom build.
        run: node sync.cjs disableUpdate

      - name: Stamp the release version into package.json
        shell: pwsh
        run: |
          $pj = Get-Content package.json -Raw | ConvertFrom-Json
          $pj.version = $env:APP_VERSION
          $pj | ConvertTo-Json -Depth 20 | Set-Content package.json -Encoding utf8
          Write-Host "package.json version: $((Get-Content package.json -Raw | ConvertFrom-Json).version)"

      - name: Build portable exe and installer
        env:
          DRAWIO_UNSIGNED: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --config electron-builder-win.json --publish never

      - name: Show built artifacts
        shell: pwsh
        run: Get-ChildItem ../releases -Filter *.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: mermaid-manager-${{ env.RELEASE_TAG }}
          path: releases/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: MermaidApp Studio ${{ env.APP_VERSION }}
          body: |
            MermaidApp Studio ${{ env.APP_VERSION }}

            - `MermaidApp-draw.io-v${{ env.APP_VERSION }}-Setup.exe` — Windows installer
            - `MermaidApp-draw.io-v${{ env.APP_VERSION }}-Portable.exe` — no-install portable build

            Unsigned personal build; Windows may show a SmartScreen prompt.
          files: releases/*.exe
          fail_on_unmatched_files: true
